# Creature Sweeper: the per-type ladder schedules, read by ladders.py.
#
# One [[type]] per ladder, in menu-independent order (ladders.py sorts them). ladders.py derives
# every board from these: it apportions the creatures, computes C_k and the thresholds, and
# continues each schedule past board 10. Edit here, run `python design/ladders.py`, and never edit
# design/data/ladders.json by hand (CI checks it is the generator's output).
#
# The schema, enforced by `load_types` in ladders.py. A schedule is a list of ten, one per board.
#
#   id, name, tint     the ladder's id, display name and card colour
#   archetype          "descending" (fewer of each stronger tier) or "flat" (as many of each)
#   axis, blurb        the one-line and the paragraph the ladder list shows
#   size               schedule of [width, height]
#   tiers              schedule: creature tiers on the board
#   density            schedule: creatures as a share of the cells they may stand on
#   hp                 schedule: max HP
#   lock               schedule: how many top thresholds are exact C_k gates
#   alpha0             schedule: where the unlocked thresholds start, as a share of C_k
#
#   boss               schedule: creatures pinned at the top tier (absent: none pinned)
#   sweep              false on a ladder that offers no Sweep
#   spells, start_mana the magic ladders' loadout and opening mana
#   workout            WORKOUT's Exercise pricing: base, step, relief, exp_multiplier
#   placement          a placement rule (src/engine/placement/registry.ts); absent is uniform
#   sets               DOMINOES: schedule of whole domino sets
#   givens             SUDOKU: schedule of clues
#   topology, wrap     "hex"; "horizontal" or "both"
#   shape, shape_param a board shape (src/engine/shape/registry.ts) and its size in cells
#   cells              the seeded shapes: schedule of exact cell counts
#   reach              the crawl rule's radius (DUNGEON)
#   opening            how the board is opened: "base" deals its bottom two rows face up
#                      (PYRAMID); absent is the placement rule's own, usually the largest blank area
#   search             true on a search ladder: level 0, won by uncovering every empty cell
#   ceiling            this ladder's own caps on the continuation past board 10

